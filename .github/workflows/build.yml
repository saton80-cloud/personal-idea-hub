name: build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmony-source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate HarmonyOS project and API contract wiring
        run: node scripts/validate-harmony-project.mjs
      - name: Validate offline sync and last-write-wins wiring
        run: node scripts/validate-sync-policy.mjs

  server-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore core projects
        run: dotnet restore src/PersonalWorkBoard.Server/PersonalWorkBoard.Server.csproj
      - name: Test
        run: dotnet test tests/PersonalWorkBoard.Domain.Tests/PersonalWorkBoard.Domain.Tests.csproj -c Release
      - name: Publish Rocky Linux server
        run: dotnet publish src/PersonalWorkBoard.Server/PersonalWorkBoard.Server.csproj -c Release -r linux-x64 --self-contained true -o artifacts/server-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: personal-work-board-server-linux-x64
          path: artifacts/server-linux-x64
          if-no-files-found: error

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Publish Windows desktop
        run: dotnet publish src/PersonalWorkBoard.Client/PersonalWorkBoard.Client.csproj -f net10.0-windows10.0.19041.0 -c Release -p:ClientTargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -o artifacts/windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: personal-work-board-windows-x64
          path: artifacts/windows-x64
          if-no-files-found: error

  android-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android APK
        run: dotnet publish src/PersonalWorkBoard.Client/PersonalWorkBoard.Client.csproj -f net10.0-android -c Release -p:ClientTargetFramework=net10.0-android -p:AndroidPackageFormats=apk -o artifacts/android
      - name: Export Android APK signing verifier
        shell: pwsh
        run: |
          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $buildTools) {
            throw "Android build-tools were not found."
          }
          New-Item -ItemType Directory -Force artifacts/android-signing-tools | Out-Null
          Copy-Item "$($buildTools.FullName)\lib\apksigner.jar" artifacts/android-signing-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: personal-work-board-android-apk
          path: artifacts/android/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools
          path: artifacts/android-signing-tools/apksigner.jar
          if-no-files-found: error
